# Netlify 配置（只有"用 Git 仓库自动发布"时才用得上；手动拖拽上传不需要这个文件）
#
# 仓库根目录是「整理部署」这一层，网站程序在 NoteWeb/ 子目录里：
#   ① 已总结稿.md\  —— 25 篇笔记的源文件（仓库里有）
#   ② NoteWeb\      —— 网站程序；dist\ 是现场打包出来的成品
#
# 音频分两套：
#   music\      —— 14 首 FLAC，468 MB，只在本机听；被 .gitignore 排除，不进仓库
#   music-web\  —— 14 首 MP3（160 kbps），约 52 MB，单首最大 5.1 MB，放进仓库给线上用
# 下面 NW_MUSIC_DIR 就是让线上打包用 MP3 那一套；不设的话只会打出一个没有音乐的纯笔记版。

[build]
  base = "NoteWeb"
  command = "node scripts/sync-notes.mjs && node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NW_MUSIC_DIR = "music-web"
